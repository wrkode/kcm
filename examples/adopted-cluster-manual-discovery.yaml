apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterDeployment
metadata:
  name: adopted-cluster-manual
  namespace: default
spec:
  template: adopted-cluster
  credential: azure-credentials
  adoptedCluster:
    enabled: true
    discoveryMode: "manual"  # Manual discovery mode
    infrastructureMapping:
      provider: "azure"
      region: "eastus"
      credentials:
        secretName: "azure-credentials"
        namespace: "default"
      nodeMapping:
        - nodeName: "aks-agentpool-12345678-vmss000000"
          machineName: "worker-machine-1"
          infrastructureRef:
            apiVersion: "infrastructure.cluster.x-k8s.io/v1beta1"
            kind: "AzureMachine"
            name: "worker-machine-1"
        - nodeName: "aks-agentpool-12345678-vmss000001"
          machineName: "worker-machine-2"
          infrastructureRef:
            apiVersion: "infrastructure.cluster.x-k8s.io/v1beta1"
            kind: "AzureMachine"
            name: "worker-machine-2"
        - nodeName: "aks-agentpool-12345678-vmss000002"
          machineName: "worker-machine-3"
          infrastructureRef:
            apiVersion: "infrastructure.cluster.x-k8s.io/v1beta1"
            kind: "AzureMachine"
            name: "worker-machine-3"
    lifecycleManagement:
      enabled: true
      scaling:
        enabled: true
        autoScaling: true
        minNodes: 3
        maxNodes: 15
        nodeGroups:
          - name: "worker-pool"
            instanceType: "Standard_D2s_v3"
            minNodes: 3
            maxNodes: 12
            labels:
              node-role.kubernetes.io/worker: "true"
            taints: []
      upgrades:
        enabled: true
        autoUpgrade: true
        maintenanceWindow: "0 3 * * 0"  # Sundays at 3 AM
        upgradeStrategy: "rolling"
        maxUnavailable: 1
      monitoring:
        enabled: true
        metrics:
          - "cpu_usage_percent"
          - "memory_usage_percent"
          - "disk_usage_percent"
          - "network_usage"
        healthChecks:
          enabled: true
          interval: "60s"
          timeout: "15s"
          failureThreshold: 5
      backup:
        enabled: true
        schedule: "0 2 * * *"  # Daily at 2 AM
        retention: "7d"
        storage:
          type: "azure"
          location: "https://storageaccount.blob.core.windows.net/backup-container/"
          credentials:
            secretName: "azure-backup-credentials"
            namespace: "default" 