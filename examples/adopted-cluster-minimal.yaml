apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterDeployment
metadata:
  name: adopted-cluster-minimal
  namespace: default
spec:
  template: adopted-cluster
  adoptedCluster:
    enabled: true
    discoveryMode: "auto"
    infrastructureMapping:
      provider: "aws"
      region: "us-west-2"
      credentials:
        secretName: "aws-credentials"
        namespace: "default"
    lifecycleManagement:
      enabled: true
      scaling:
        enabled: false  # Disable scaling for minimal example
      upgrades:
        enabled: false  # Disable upgrades for minimal example
      monitoring:
        enabled: true
        metrics:
          - "cpu_usage_percent"
          - "memory_usage_percent"
        healthChecks:
          enabled: true
          interval: "30s"
          timeout: "10s"
          failureThreshold: 3
      backup:
        enabled: false  # Disable backup for minimal example 